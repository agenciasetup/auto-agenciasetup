<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- A capa do livro Dúvidas da Fé (1600 × 2400). A pintura entra num arco de vitral, sobre o azul de Nossa Senhora,
     com o título em serifa clássica e o ouro só nos detalhes. Exporta com: node scripts/duvidas.mjs capa
     ?pintura=<arquivo em Curso-Duvidas/img> troca a pintura; ?foco=50% 45% acerta o corte. A pintura é a Imaculada (Murillo), em 1376 px, do repositório do Olhar de Fé. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --noite: #0B1730; --azul: #15284B; --ouro: #D6AA55; --ouro-2: #F0D08A; --creme: #F7F0E1; }
  html, body { margin: 0; background: #000; }
  .capa {
    position: relative; width: 1600px; height: 2400px; overflow: hidden; color: var(--creme); font-family: Inter, sans-serif;
    background:
      radial-gradient(60% 40% at 50% 27%, rgba(214,170,85,.26), transparent 72%),
      radial-gradient(90% 50% at 50% 100%, rgba(30,58,110,.55), transparent 70%),
      linear-gradient(180deg, #142A52 0%, var(--noite) 58%, #08122A 100%);
  }
  /* Moldura dupla em ouro, fina, como nos livros de oração. */
  .moldura { position: absolute; inset: 54px; border: 3px solid rgba(214,170,85,.6); border-radius: 10px; }
  .moldura::after { content: ""; position: absolute; inset: 16px; border: 1.5px solid rgba(214,170,85,.28); border-radius: 6px; }
  /* O arco (janela de igreja) com a pintura. */
  .arco {
    position: absolute; left: 270px; top: 180px; width: 1060px; height: 1140px; overflow: hidden; border-radius: 530px 530px 22px 22px;
    box-shadow: 0 0 0 7px var(--noite), 0 0 0 11px var(--ouro), 0 50px 120px rgba(0,0,0,.55);
  }
  .arco img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .arco::after { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 35%, transparent 55%, rgba(8,18,42,.35)); }
  .texto { position: absolute; left: 120px; right: 120px; top: 1395px; text-align: center; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .orn i { width: 170px; height: 2px; background: linear-gradient(90deg, transparent, var(--ouro)); }
  .orn i:last-child { transform: scaleX(-1); }
  .orn svg { width: 30px; height: 42px; fill: var(--ouro); }
  h1 { margin: 26px 0 0; font: 700 236px/.9 'Playfair Display', serif; letter-spacing: -.012em; color: var(--creme); }
  h1 em { display: block; margin-top: 6px; font-style: italic; font-weight: 600; font-size: 200px; color: var(--ouro-2); }
  .sub { margin: 46px auto 0; max-width: 1120px; font: 500 52px/1.32 Inter, sans-serif; color: rgba(247,240,225,.86); text-wrap: balance; }
  .autores { position: absolute; left: 0; right: 0; bottom: 128px; text-align: center; font: 600 40px/1 Inter, sans-serif; letter-spacing: .26em; text-transform: uppercase; color: var(--ouro); }
</style>
</head>
<body>
<div class="capa" id="capa">
  <div class="moldura"></div>
  <div class="arco"><img id="pintura" alt=""></div>
  <div class="texto">
    <div class="orn"><i></i><svg viewBox="0 0 16 22"><path d="M6.6 0h2.8v6h5.6v2.8H9.4V22H6.6V8.8H1V6h5.6z"/></svg><i></i></div>
    <h1>Dúvidas <em>da Fé</em></h1>
    <p class="sub">60 perguntas sobre a Igreja Católica, respondidas de um jeito simples</p>
  </div>
  <p class="autores">Filipe e Raquel</p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const img = document.getElementById('pintura');
  img.onload = img.onerror = () => { window.PRONTO = true; };
  img.src = '../../Curso-Duvidas/img/' + (q.get('pintura') || 'imaculada-murillo-bd89b941-1376.webp');
  img.style.objectPosition = q.get('foco') || '50% 45%';
</script>
</body>
</html>
