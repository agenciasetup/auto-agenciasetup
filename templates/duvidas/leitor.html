<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dúvidas da Fé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="duvidas.css">
<script src="../../_local/duvidas/dados.js"></script>
<script src="render.js"></script>
</head>
<body>
<main class="leitor" id="leitor"></main>
<script>
// Prévia do leitor no computador: ?tela=inicio ou ?tela=duvida&d=<slug>. Os números de leitura são de exemplo.
const q = new URLSearchParams(location.search);
const { curso, duvidas } = window.DADOS;
const raiz = document.getElementById('leitor');
const pdf = `<a class="pilula" href="#">${icone('baixar')}PDF</a>`;
const ajuda = `<a class="ajuda" href="https://wa.me/${curso.whatsapp}">${icone('zap')}<span><b>Ficou com alguma dificuldade?</b>Fale com a gente no WhatsApp</span></a>`;

if (q.get('tela') === 'duvida') {
  const slugs = Object.keys(duvidas);
  const d = duvidas[q.get('d')] || duvidas[slugs[0]];
  const cap = capituloDe(d.slug);
  const proxima = duvidas[slugs[(slugs.indexOf(d.slug) + 1) % slugs.length]];
  raiz.innerHTML = `<div class="topo"><a class="voltar" href="?tela=inicio">${icone('voltar')}Capítulo ${cap.numero}</a>${pdf}</div>
    ${duvidaHTML(d)}
    <a class="proxima" href="?tela=duvida&d=${proxima.slug}"><span class="olho">Próxima dúvida</span><b>${proxima.titulo}</b><span class="roda">${icone('avancar')}</span></a>
    ${ajuda}
    <p class="feita">Dúvidas da Fé · ${curso.autores}</p>`;
} else {
  const lidas = 12;
  raiz.innerHTML = `<div class="topo"><span class="marca"><span class="cruz"></span>Dúvidas da Fé</span>${pdf}</div>
    <img class="capa-inicio" src="${window.DADOS.img}${curso.capa.arquivo}" alt="${curso.capa.alt}">
    <h1 class="ola">Olá, Maria</h1>
    <p class="ola-sub">Escolha uma dúvida ou procure a sua.</p>
    <div class="busca">${icone('busca')}Qual é a sua dúvida?</div>
    <div class="cartao">
      <p class="olho">Continue de onde parou</p>
      <h2>Por que confessar os pecados a um padre?</h2>
      <div class="prog"><span><i style="width:${(lidas / curso.total) * 100}%"></i></span><b>${lidas} de ${curso.total} lidas</b></div>
      <a class="botao" href="?tela=duvida&d=confissao-ao-padre">Continuar lendo ${icone('avancar')}</a>
    </div>
    <p class="olho rotulo">Os ${curso.capitulos.length} capítulos</p>
    <div class="lista">${curso.capitulos.map((c) => `<a class="linha" href="#"><span class="num">${c.numero}</span><span><b>${c.titulo}</b><small>${c.duvidas.length} dúvidas</small></span><span class="seta">${icone('seta')}</span></a>`).join('')}</div>
    ${ajuda}`;
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-letra')) {
    const h = document.documentElement;
    const n = h.classList.contains('letra-2') ? 0 : h.classList.contains('letra-1') ? 2 : 1;
    h.classList.remove('letra-1', 'letra-2');
    if (n) h.classList.add(`letra-${n}`);
  }
  if (b.hasAttribute('data-ouvir')) {
    if (speechSynthesis.speaking) return speechSynthesis.cancel();
    const art = document.querySelector('.duvida');
    const partes = [art.querySelector('h1'), art.querySelector('.resposta-tx'), ...art.querySelectorAll('.prosa p, .diga-tx')];
    const fala = new SpeechSynthesisUtterance(partes.map((x) => x.textContent).join('. '));
    fala.lang = 'pt-BR';
    fala.rate = 0.95;
    speechSynthesis.speak(fala);
  }
});
window.PRONTO = true;
</script>
</body>
</html>
