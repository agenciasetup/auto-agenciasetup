<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Peças simples de divulgação do Dúvidas da Fé: o livro em 3D, o nome, a linha e o preço, no azul e ouro da capa.
     ?formato=story (1080 × 1920) ou ?formato=faixa (1920 × 800, 6:2,5). A capa vem de Curso-Duvidas/img/capa-livro.jpg
     (node scripts/duvidas.mjs capa). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --noite: #0A1429; --ouro: #D9AE57; --ouro-2: #F0D08A; --creme: #F7F0E1; --verde: #1F9F57; }
  html, body { margin: 0; background: #000; }
  .peca { position: relative; overflow: hidden; color: var(--creme); font-family: Inter, sans-serif; display: flex; align-items: center;
    background: radial-gradient(55% 40% at 50% 30%, rgba(217,174,87,.3), transparent 70%), radial-gradient(90% 60% at 50% 110%, rgba(40,75,140,.5), transparent 70%), linear-gradient(180deg, #142A52, var(--noite) 60%, #070F20); }
  .moldura { position: absolute; inset: 34px; border: 2px solid rgba(217,174,87,.45); border-radius: 10px; pointer-events: none; }
  /* o livro em pé, com a lombada e as folhas */
  .livro { position: relative; aspect-ratio: 2/3; transform: perspective(1800px) rotateY(-17deg) rotateX(3deg); filter: drop-shadow(0 50px 60px rgba(0,0,0,.55)); }
  .livro img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 4px 10px 10px 4px; }
  .livro::before { content: ""; position: absolute; z-index: 2; left: 0; top: 0; bottom: 0; width: 7%; border-radius: 4px 0 0 4px; background: linear-gradient(90deg, rgba(255,255,255,.3), rgba(0,0,0,.3) 45%, rgba(255,255,255,.06) 70%, transparent); }
  .livro::after { content: ""; position: absolute; top: 1.4%; bottom: 1.4%; right: -16px; width: 18px; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(180deg, #F4EDE0 0 3px, #D8CDB9 3px 4.5px); }
  .txt { display: grid; }
  .digital { justify-self: start; display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; background: rgba(217,174,87,.14); box-shadow: inset 0 0 0 2px rgba(217,174,87,.5); color: var(--ouro-2); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font: 700 1em/.95 'Playfair Display', serif; letter-spacing: -.01em; }
  h1 em { display: block; font-style: italic; font-weight: 600; color: var(--ouro-2); }
  .linha { margin: 0; font-weight: 500; color: rgba(247,240,225,.88); line-height: 1.3; }
  .preco { justify-self: start; display: inline-flex; align-items: baseline; gap: .25em; padding: .28em .7em .32em; border-radius: 999px; background: var(--verde); color: #fff; font-weight: 700; letter-spacing: -.01em; box-shadow: 0 20px 50px rgba(31,159,87,.4), inset 0 2px 0 rgba(255,255,255,.2); }
  .preco small { font-size: .5em; font-weight: 600; opacity: .9; }

  /* story: tudo centralizado, longe das bordas de cima e de baixo (onde o Instagram põe nome e resposta) */
  .story { width: 1080px; height: 1920px; flex-direction: column; justify-content: center; gap: 56px; padding: 260px 90px; box-sizing: border-box; text-align: center; }
  .story .livro { width: 460px; }
  .story .txt { justify-items: center; gap: 34px; }
  .story .digital, .story .preco { justify-self: center; }
  .story .digital { font-size: 26px; }
  .story h1 { font-size: 140px; }
  .story .linha { font-size: 48px; max-width: 820px; }
  .story .preco { font-size: 90px; margin-top: 6px; }

  /* faixa 6:2,5: o livro à esquerda, o texto à direita */
  .faixa { width: 1920px; height: 800px; gap: 110px; padding: 0 150px 0 230px; box-sizing: border-box; }
  .faixa .livro { width: 380px; flex: none; }
  .faixa .txt { gap: 26px; }
  .faixa .digital { font-size: 22px; }
  .faixa h1 { font-size: 132px; }
  .faixa h1 em { display: inline; }
  .faixa .linha { font-size: 46px; }
  .faixa .preco { font-size: 76px; margin-top: 8px; }
  .faixa .moldura { inset: 26px; }
</style>
</head>
<body>
<div class="peca" id="peca">
  <div class="moldura"></div>
  <div class="livro"><img id="capa" alt="Capa do livro Dúvidas da Fé"></div>
  <div class="txt">
    <span class="digital">Livro digital</span>
    <h1>Dúvidas <em>da Fé</em></h1>
    <p class="linha">60 perguntas sobre a fé católica</p>
    <span class="preco"><small>R$</small>19,90</span>
  </div>
</div>
<script>
  const formato = new URLSearchParams(location.search).get('formato') || 'story';
  document.getElementById('peca').classList.add(formato);
  const img = document.getElementById('capa');
  img.onload = img.onerror = () => { window.PRONTO = true; };
  img.src = '../../Curso-Duvidas/img/capa-livro.jpg';
</script>
</body>
</html>
