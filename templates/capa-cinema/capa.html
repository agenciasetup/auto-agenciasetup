<!doctype html>
<!-- Capa "cinema" (24/10/2026, depois do retorno do dono: "recorte lixo, sombras e efeitos péssimos jogados aleatoriamente,
     blur branco atrás feio, desfoques aleatórios"). A foto gerada inteira é o fundo; o título fica em cima e passa ATRÁS
     da cabeça com o recorte da MESMA foto por cima (encaixa pixel por pixel, então não sobra borda). Sem blur, sem halo,
     sem brilho, sem sombra projetada, sem régua. Configuração em capas.js; exportar.mjs fotografa em 1080 x 1350. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #0b0b0c; overflow: hidden; }
  .janela { position: absolute; inset: 40px; border-radius: 46px; overflow: hidden; background: #111; isolation: isolate; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06); }
  .foto, .recorte { position: absolute; display: block; }
  .foto { z-index: 1; }
  .sombra-topo { position: absolute; inset: 0 0 auto 0; height: 640px; z-index: 2; pointer-events: none; }
  .titulo { position: absolute; left: 0; right: 0; z-index: 3; text-align: center; color: #fff; }
  .recorte { z-index: 4; }
  .titulo .pre, .titulo .pos { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 46px; letter-spacing: -0.01em; line-height: 1; }
  .titulo .serifa { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.22em; letter-spacing: 0; }
  .titulo .grande { font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: 0.86; letter-spacing: -0.005em; display: block; margin: 14px 0 12px; }
  .cabecalho { position: absolute; z-index: 6; top: 30px; left: 0; right: 0; display: flex; justify-content: center; font-family: 'Outfit', sans-serif; font-size: 30px; color: #fff; }
  .cabecalho b { font-weight: 600; }
  .cromo { position: absolute; z-index: 6; top: 40px; width: 30px; height: 30px; }
  .cromo path { stroke: #fff; stroke-width: 3; stroke-linecap: round; fill: none; }
  .notificacao { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); width: 780px; display: flex; gap: 22px; align-items: center; padding: 22px 28px; border-radius: 38px;
    font-family: 'Inter', system-ui, sans-serif; background: rgba(250, 250, 248, 0.96); color: #111; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28); }
  .notificacao.escura { background: rgba(28, 28, 30, 0.94); color: #f5f5f7; }
  .notificacao .app { flex: none; width: 88px; height: 88px; border-radius: 21px; display: grid; place-items: center; background: #d97757; }
  .notificacao .app svg { width: 58px; height: 58px; }
  .notificacao .app path { fill: #fbf6ee; }
  .notificacao .corpo { flex: 1; min-width: 0; }
  .notificacao .cabeca { display: flex; justify-content: space-between; align-items: baseline; }
  .notificacao .cabeca b { font-size: 32px; font-weight: 600; letter-spacing: -0.015em; }
  .notificacao .cabeca time { font-size: 25px; opacity: 0.45; }
  .notificacao p { font-size: 29px; line-height: 1.28; margin-top: 4px; opacity: 0.82; letter-spacing: -0.01em; }
  .nota { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); width: 860px; padding: 26px 34px; border-radius: 30px; background: rgba(250, 250, 248, 0.96); color: #111;
    font-family: 'Outfit', sans-serif; font-size: 38px; line-height: 1.2; text-align: left; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28); }
  .nota.escura { background: rgba(28, 28, 30, 0.94); color: #f5f5f7; }
  .nota .serifa { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 52px; color: #e86a00; }
  .nota.escura .serifa { color: #ffb000; }
  .nota small { display: block; margin-top: 10px; font-family: 'Inter', sans-serif; font-size: 25px; opacity: 0.62; }
  .pos-solta { position: absolute; z-index: 5; color: #fff; white-space: nowrap; font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 46px; letter-spacing: -0.01em; line-height: 1.05; }
  .pos-solta .serifa { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.25em; letter-spacing: 0; }
  .selo { position: absolute; z-index: 7; display: flex; align-items: flex-start; }
  .selo svg { width: 40px; height: 40px; margin-right: -6px; }
  .selo b { margin-top: 30px; padding: 3px 14px 6px; border-radius: 7px; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 700; color: #fff; background: #ff7a00; }
</style>
</head>
<body>
<div class="janela" id="janela"></div>
<script src="capas.js"></script>
<script>
  const CLAUDE = 'm19.6 66.5 19.7-11 .3-1-.3-.5h-1l-3.3-.2-11.2-.3L14 53l-9.5-.5-2.4-.5L0 49l.2-1.5 2-1.3 2.9.2 6.3.5 9.5.6 6.9.4L38 49.1h1.6l.2-.7-.5-.4-.4-.4L29 41l-10.6-7-5.6-4.1-3-2-1.5-2-.6-4.2 2.7-3 3.7.3.9.2 3.7 2.9 8 6.1L37 36l1.5 1.2.6-.4.1-.3-.7-1.1L33 25l-6-10.4-2.7-4.3-.7-2.6c-.3-1-.4-2-.4-3l3-4.2L28 0l4.2.6L33.8 2l2.6 6 4.1 9.3L47 29.9l2 3.8 1 3.4.3 1h.7v-.5l.5-7.2 1-8.7 1-11.2.3-3.2 1.6-3.8 3-2L61 2.6l2 2.9-.3 1.8-1.1 7.7L59 27.1l-1.5 8.2h.9l1-1.1 4.1-5.4 6.9-8.6 3-3.5L77 13l2.3-1.8h4.3l3.1 4.7-1.4 4.9-4.4 5.6-3.7 4.7-5.3 7.1-3.2 5.7.3.4h.7l12-2.6 6.4-1.1 7.6-1.3 3.5 1.6.4 1.6-1.4 3.4-8.2 2-9.6 2-14.3 3.3-.2.1.2.3 6.4.6 2.8.2h6.8l12.6 1 3.3 2 1.9 2.7-.3 2-5.1 2.6-6.8-1.6-16-3.8-5.4-1.3h-.8v.4l4.6 4.5 8.3 7.5L89 80.1l.5 2.4-1.3 2-1.4-.2-9.2-7-3.6-3-8-6.8h-.5v.7l1.8 2.7 9.8 14.7.5 4.5-.7 1.4-2.6 1-2.7-.6-5.8-8-6-9-4.7-8.2-.5.4-2.9 30.2-1.3 1.5-3 1.2-2.5-2-1.4-3 1.4-6.2 1.6-8 1.3-6.4 1.2-7.9.7-2.6v-.2H49L43 72l-9 12.3-7.2 7.6-1.7.7-3-1.5.3-2.8L24 86l10-12.8 6-7.9 4-4.6-.1-.5h-.3L17.2 77.4l-4.7.6-2-2 .2-3 1-1 8-5.5Z';
  const CURSOR = '<svg viewBox="0 0 46 46"><path d="M6 4 L41 21 L25 26 L19 42 Z" fill="#ff7a00" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
  const q = new URLSearchParams(location.search);
  const c = window.CAPAS[q.get('c')];
  const j = document.getElementById('janela');
  // A foto e o recorte com a MESMA caixa: largura em px e posição (a janela tem 1000 x 1270).
  const caixa = `left:${c.foto.x}px;top:${c.foto.y}px;width:${c.foto.w}px`;
  const so = q.get('so'); // so=foto: só a foto (para conferir o enquadramento)
  // etapa=1 a 3: a capa sendo montada, para o carrossel que mostra o processo. 1 = a foto; 2 = mais o título (por
  // cima de tudo); 3 = mais o recorte na frente do título. Sem etapa (ou 4): a capa inteira, com a notificação.
  const etapa = Number(q.get('etapa')) || 4;
  j.innerHTML = `
    <img class="foto" src="../../_local/capas-v2/${c.foto.arq}.png" style="${caixa}" alt="">
    ${c.sombraTopo && etapa >= 2 ? `<div class="sombra-topo" style="background:linear-gradient(180deg, rgba(0,0,0,${c.sombraTopo}) 0%, rgba(0,0,0,${c.sombraTopo * 0.55}) 45%, rgba(0,0,0,0) 100%)"></div>` : ''}
    ${so === 'foto' ? '' : `${etapa < 2 ? '' : `<div class="titulo" style="top:${c.titulo.y}px">
      <span class="pre">${c.titulo.pre}</span>
      <span class="grande" style="font-size:${c.titulo.tam}px;color:${c.titulo.cor || '#fff'};margin-top:${14 + (c.titulo.folga || 0)}px">${c.titulo.grande}</span>
      ${c.titulo.pos ? `<span class="pos">${c.titulo.pos}</span>` : ''}
    </div>
    ${c.pos ? `<div class="pos-solta" style="left:${c.pos.x}px;top:${c.pos.y}px;width:${c.pos.w || 400}px;text-align:${c.pos.alinha || 'left'};${c.pos.cor ? `color:${c.pos.cor}` : ''}">${c.pos.html}</div>` : ''}`}
    ${c.atras === false || etapa < 3 ? '' : `<img class="recorte" src="../../_local/capas-v2/${c.foto.arq}-recorte.png" style="${caixa}" alt="">`}
    <div class="cabecalho"><span>${c.perfil || '@agenciasetup'}&nbsp;|&nbsp;<b>Calango</b></span></div>
    <svg class="cromo" style="left:52px" viewBox="0 0 32 32"><path d="M4 16h24"/></svg><svg class="cromo" style="right:52px" viewBox="0 0 32 32"><path d="M7 7l18 18M25 7L7 25"/></svg>
    ${etapa < 4 ? '' : `
    ${c.notificacao ? `<div class="notificacao${c.notificacao.escura ? ' escura' : ''}" style="top:${c.notificacao.y}px"><div class="app"><svg viewBox="0 0 100 100"><path d="${CLAUDE}"/></svg></div><div class="corpo"><div class="cabeca"><b>Claude</b><time>${c.notificacao.quando || 'agora'}</time></div><p>${c.notificacao.texto}</p></div></div>` : ''}
    ${c.nota ? `<div class="nota${c.nota.escura ? ' escura' : ''}" style="top:${c.nota.y}px">${c.nota.html}${c.nota.sub ? `<small>${c.nota.sub}</small>` : ''}</div>` : ''}
    ${c.selo ? `<div class="selo" style="left:${c.selo.x}px;top:${c.selo.y}px">${CURSOR}<b>calango</b></div>` : ''}`}`}`;
  document.fonts.ready.then(() => Promise.all([...document.images].map((i) => (i.complete ? null : new Promise((r) => { i.onload = r; i.onerror = r; }))))).then(() => { window.PRONTO = true; });
</script>
</body>
</html>
